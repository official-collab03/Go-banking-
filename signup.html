<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Open an account — GoBank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  * { box-sizing: border-box; }
  body { background: var(--pnb-bg); margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; }
  .auth-container { width: 100%; max-width: 480px; padding: 24px 16px 60px; display: flex; flex-direction: column; }
  .auth-brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px; text-decoration: none; }
  .auth-card { background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04); border: 1px solid var(--line); padding: 32px 24px; width: 100%; }
  .auth-card h1 { font-size: 1.5rem; color: var(--pnb-blue); margin: 0 0 6px; letter-spacing: -0.02em; }
  .auth-card .sub { color: var(--text-faint); font-size: 0.88rem; margin: 0 0 24px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .field input { width: 100%; padding: 12px 14px; border: 1px solid var(--line-2); border-radius: 10px; font-family: inherit; font-size: 0.9rem; color: var(--ink); background: #fbfdff; }
  .field input:focus { outline: none; border-color: var(--pnb-gold); box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.12); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .check-group { display: flex; align-items: flex-start; gap: 10px; margin: 20px 0; }
  .check-group input { width: auto; margin-top: 3px; accent-color: var(--pnb-gold); }
  .check-group label { font-size: 0.8rem; color: var(--text-dim); line-height: 1.5; }
  .btn-submit { width: 100%; padding: 14px; border-radius: 10px; border: none; background: var(--pnb-gold); color: #fff; font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer; }
  .btn-submit:hover { background: var(--pnb-gold-hover); }
  .auth-footer { text-align: center; margin-top: 24px; font-size: 0.85rem; color: var(--text-faint); }
  .auth-footer a { font-weight: 700; color: var(--pnb-gold-hover); }
  .form-alert { padding: 12px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 16px; display: none; }
  .form-alert.show { display: block; }
  .form-alert.error { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
  .form-alert.success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
  @media (max-width: 400px) { .field-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="auth-container">
  <a href="index.html" class="auth-brand">
    <svg viewBox="0 0 100 100" width="40" height="40" fill="none"><circle cx="50" cy="50" r="48" fill="#0ea5e9"/><path d="M55 20 L25 55 H45 L40 85 L75 45 H55 Z" fill="#ffffff"/></svg>
    <span style="font-size:1.8rem; font-weight:900; color:var(--pnb-blue); letter-spacing:-0.04em;">GoBank</span>
  </a>
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="sub">It only takes a few minutes to get started.</p>
    <div class="form-alert" id="signupAlert"></div>
    <form id="signupForm">
      <div class="field"><label>Full legal name</label><input type="text" id="fullName" placeholder="Maria Santos" required /></div>
      <div class="field-row">
        <div class="field"><label>Email address</label><input type="email" id="email" placeholder="you@example.com" required /></div>
        <div class="field"><label>Phone number</label><input type="tel" id="phone" placeholder="+63 912 345 6789" required /></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Date of birth</label><input type="date" id="dob" required /></div>
        <div class="field"><label>ZIP / Postal code</label><input type="text" id="zip" placeholder="1200" maxlength="10" /></div>
      </div>
      <div class="field"><label>Street address</label><input type="text" id="street" placeholder="123 Ayala Avenue" required /></div>
      <div class="field-row">
        <div class="field"><label>City</label><input type="text" id="city" placeholder="Makati" required /></div>
        <div class="field"><label>Province</label><input type="text" id="state" placeholder="Metro Manila" /></div>
      </div>
      <div class="field"><label>Password</label><input type="password" id="password" placeholder="At least 8 characters" minlength="8" required /></div>
      <div class="field-row">
        <div class="field"><label>Transaction PIN</label><input type="password" id="pin" placeholder="••••" maxlength="4" inputmode="numeric" required /></div>
        <div class="field"><label>Confirm PIN</label><input type="password" id="pinConfirm" placeholder="••••" maxlength="4" inputmode="numeric" required /></div>
      </div>
      <div class="check-group"><input type="checkbox" id="agree" required /><label for="agree">I agree to the GoBank Terms and Privacy Policy.</label></div>
      <button type="submit" class="btn-submit" id="submitBtn"><i class="fas fa-user-plus"></i> Create account</button>
    </form>
  </div>
  <div class="auth-footer">Already have an account? <a href="login.html">Log in</a></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const signupForm = document.getElementById('signupForm'), alertEl = document.getElementById('signupAlert'), submitBtn = document.getElementById('submitBtn');
function showAlert(msg, type) { alertEl.textContent = msg; alertEl.className = 'form-alert show ' + (type || 'error'); }
signupForm.addEventListener('submit', async (e) => {
  e.preventDefault(); alertEl.className = 'form-alert';
  const pin = document.getElementById('pin').value.trim();
  if (pin !== document.getElementById('pinConfirm').value.trim()) return showAlert('PINs do not match.');
  if (!/^\d{4}$/.test(pin)) return showAlert('PIN must be 4 digits.');
  submitBtn.disabled = true; submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Creating…';
  try {
    const email = document.getElementById('email').value.trim().toLowerCase();
    const cred = await auth.createUserWithEmailAndPassword(email, document.getElementById('password').value);
    const uid = cred.user.uid;
    await cred.user.updateProfile({ displayName: document.getElementById('fullName').value.trim() });
    await db.collection('swifttrust_users').doc(uid).set({
      uid, role: 'customer', status: 'pending',
      fullName: document.getElementById('fullName').value.trim(), email,
      phone: document.getElementById('phone').value.trim(), dob: document.getElementById('dob').value,
      address: { street: document.getElementById('street').value.trim(), city: document.getElementById('city').value.trim(), state: document.getElementById('state').value.trim(), zip: document.getElementById('zip').value.trim() },
      pinHash: stbHashPin(pin), createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    const routing = stbGenRoutingNumber();
    await db.collection('swifttrust_accounts').doc().set({ ownerId: uid, ownerName: document.getElementById('fullName').value.trim(), type: 'checking', nickname: 'Everyday Checking', accountNumber: stbGenAccountNumber(), routingNumber: routing, balance: 0, currency: 'PHP', status: 'active', createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    await db.collection('swifttrust_accounts').doc().set({ ownerId: uid, ownerName: document.getElementById('fullName').value.trim(), type: 'savings', nickname: 'High-Yield Savings', accountNumber: stbGenAccountNumber(), routingNumber: routing, balance: 0, currency: 'PHP', status: 'active', createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    await auth.signOut(); showAlert('Account created. Redirecting…', 'success');
    setTimeout(() => window.location.href = 'login.html', 1200);
  } catch (err) { showAlert(err.code === 'auth/email-already-in-use' ? 'Email already registered.' : 'Something went wrong.'); }
  finally { submitBtn.disabled = false; submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create account'; }
});
</script>
</body>
</html>
